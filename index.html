<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suma de manzanas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg:#eef5ea;--card:#ffffff;--ink:#1f2a1c;--muted:#5d6e57;--zone:#f7fbf4;--line:#b5cfa9;--accent:#c8282d;--wood:#b9803f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a10;--card:#1c2719;--ink:#e9f2e5;--muted:#9bb092;--zone:#16210f;--line:#3d5634;--accent:#ef5a5e;--wood:#d79a55}}
:root[data-theme="dark"]{--bg:#121a10;--card:#1c2719;--ink:#e9f2e5;--muted:#9bb092;--zone:#16210f;--line:#3d5634;--accent:#ef5a5e;--wood:#d79a55}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;padding:20px 16px 40px}
main{max-width:760px;margin:0 auto}
h1{font-size:1.9rem;margin:0 0 4px;font-weight:600}
.sub{margin:0 0 18px;color:var(--muted)}
.bar{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin-bottom:16px}
#source{touch-action:none;cursor:grab;user-select:none;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:10px 18px;display:flex;align-items:center;gap:12px}
#source .fruit{font-size:44px;line-height:1}
#source small{color:var(--muted);display:block}
#trash{flex:1;min-width:150px;border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);gap:8px;padding:10px}
#trash.over{border-color:var(--accent);color:var(--accent)}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.baskets{grid-template-columns:1fr}}
.basket{background:var(--card);border:3px solid var(--wood);border-radius:6px 6px 22px 22px;padding:12px}
.basket h2{margin:0 0 8px;font-size:1.1rem;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.count{background:var(--accent);color:#fff;border-radius:99px;min-width:30px;text-align:center;padding:1px 10px}
.zone{min-height:130px;background:var(--zone);border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.zone:empty::before{content:"Suelta manzanas aquí";color:var(--muted);margin:auto}
.zone.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--zone))}
.apple{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none}
.apple .fruit{font-size:42px;line-height:1}
.apple.lifting{opacity:.3}
.clone{position:absolute;top:-2px;right:-2px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:14px;line-height:1;cursor:pointer;padding:0}
.clone:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{margin-top:8px;font:inherit;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.result{margin-top:18px;background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 20px;text-align:center}
.result .eq{font-size:2.2rem;font-weight:600}
.result .eq b{color:#ffd24d}
.result p{margin:2px 0 0;opacity:.8}
.ghost{position:fixed;pointer-events:none;font-size:48px;transform:translate(-50%,-60%);z-index:99;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
</style>
</head>
<body>
<main>
  <h1>Suma de manzanas 🍎</h1>
  <p class="sub">Arrastra manzanas a las canastas. Toca ⧉ para clonar una. El resultado se calcula solo.</p>

  <div class="bar">
    <div id="source" role="button" aria-label="Arrastra para crear una manzana"><span class="fruit">🍎</span><span>Arrastra para añadir<small>Una manzana nueva</small></span></div>
    <div id="trash">🗑️ Suelta aquí para quitar</div>
  </div>

  <div class="baskets">
    <section class="basket">
      <h2>Canasta 1 <span class="count" id="ca">0</span></h2>
      <div class="zone" id="za"></div>
      <button class="btn" data-dup="za">Duplicar todas</button>
    </section>
    <section class="basket">
      <h2>Canasta 2 <span class="count" id="cb">0</span></h2>
      <div class="zone" id="zb"></div>
      <button class="btn" data-dup="zb">Duplicar todas</button>
    </section>
  </div>

  <div class="result" aria-live="polite">
    <div class="eq"><span id="ra">0</span> + <span id="rb">0</span> = <b id="rt">0</b></div>
    <p id="rtxt">Añade manzanas para ver la suma</p>
  </div>
  <button class="btn" id="reset">Vaciar todo</button>
</main>

<script>
const za=document.getElementById('za'), zb=document.getElementById('zb'), trash=document.getElementById('trash');
const $=id=>document.getElementById(id);

function makeApple(){
  const d=document.createElement('div');
  d.className='apple';
  d.innerHTML='<span class="fruit">🍎</span><button class="clone" title="Clonar" aria-label="Clonar manzana">⧉</button>';
  return d;
}
function update(){
  const a=za.children.length, b=zb.children.length, t=a+b;
  $('ca').textContent=a; $('cb').textContent=b;
  $('ra').textContent=a; $('rb').textContent=b; $('rt').textContent=t;
  $('rtxt').textContent=t===0?'Añade manzanas para ver la suma':(t===1?'1 manzana en total':t+' manzanas en total');
}

let drag=null;
function over(e){
  const t=document.elementFromPoint(e.clientX,e.clientY);
  document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  const z=t&&t.closest('.zone,#trash');
  if(z) z.classList.add('over');
  return z;
}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.clone')||e.button>0) return;
  const el=e.target.closest('.apple,#source');
  if(!el) return;
  e.preventDefault();
  const ghost=document.createElement('div');
  ghost.className='ghost'; ghost.textContent='🍎';
  document.body.appendChild(ghost);
  drag={el,ghost,fromSource:el.id==='source'};
  if(!drag.fromSource) el.classList.add('lifting');
  ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  over(e);
});
function finish(e,cancel){
  if(!drag) return;
  const z=cancel?null:over(e);
  const {el,ghost,fromSource}=drag;
  if(z){
    if(z.id==='trash'){ if(!fromSource) el.remove(); }
    else if(fromSource) z.appendChild(makeApple());
    else z.appendChild(el);
  }
  el.classList.remove('lifting');
  ghost.remove();
  document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  drag=null; update();
}
document.addEventListener('pointerup',e=>finish(e,false));
document.addEventListener('pointercancel',e=>finish(e,true));

document.addEventListener('click',e=>{
  const c=e.target.closest('.clone');
  if(c){ const a=c.closest('.apple'); a.parentNode.insertBefore(makeApple(),a.nextSibling); update(); return; }
  const d=e.target.closest('[data-dup]');
  if(d){ const z=$(d.dataset.dup); const n=z.children.length; for(let i=0;i<n;i++) z.appendChild(makeApple()); update(); }
});
$('reset').addEventListener('click',()=>{za.innerHTML='';zb.innerHTML='';update();});
update();
</script>
</body>
</html>
